<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padron's Poo Tracker</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* Tiled Background Image Settings */
            background-image: url('BG.JPG');
            background-repeat: repeat; /* This makes the image tile horizontally and vertically */
            background-size: auto; /* Keeps the image at its original size for tiling */
            background-color: var(--bg-color); /* Fallback color if image fails to load */
            
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.25rem;
            font-size: 1.4rem;
            text-align: center;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label.section-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .row {
            display: flex;
            gap: 1rem;
        }

        .row .form-group {
            flex: 1;
        }

        /* Radio Pill Group Styling */
        .radio-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
            gap: 0.5rem;
        }

        .radio-pill {
            position: relative;
        }

        .radio-pill input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-pill label {
            display: block;
            text-align: center;
            padding: 0.5rem 0.25rem;
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .radio-pill input:checked + label {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .radio-pill label:hover {
            border-color: var(--primary-color);
        }

        button[type="submit"] {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        #success-message {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #def7ec;
            color: #03543f;
            border-radius: 6px;
            text-align: center;
            font-size: 0.875rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Padron's Poo Tracker</h2>
        <form id="trackingForm">
            <!-- Date and Time Row -->
            <div class="row">
                <div class="form-group">
                    <label class="section-label" for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label class="section-label" for="time">Time</label>
                    <input type="time" id="time" name="time" required>
                </div>
            </div>

            <!-- Left Side Duration -->
            <div class="form-group">
                <label class="section-label">L Side Duration</label>
                <div class="radio-group">
                    <div class="radio-pill">
                        <input type="radio" id="l-none" name="lSide" value="None" checked>
                        <label for="l-none">None</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="l-5" name="lSide" value="5 min">
                        <label for="l-5">5 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="l-10" name="lSide" value="10 min">
                        <label for="l-10">10 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="l-15" name="lSide" value="15 min">
                        <label for="l-15">15 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="l-20" name="lSide" value="20 min">
                        <label for="l-20">20 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="l-25" name="lSide" value="25 min">
                        <label for="l-25">25 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="l-30" name="lSide" value="30 min">
                        <label for="l-30">30 min</label>
                    </div>
                </div>
            </div>

            <!-- Right Side Duration -->
            <div class="form-group">
                <label class="section-label">R Side Duration</label>
                <div class="radio-group">
                    <div class="radio-pill">
                        <input type="radio" id="r-none" name="rSide" value="None" checked>
                        <label for="r-none">None</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="r-5" name="rSide" value="5 min">
                        <label for="r-5">5 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="r-10" name="rSide" value="10 min">
                        <label for="r-10">10 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="r-15" name="rSide" value="15 min">
                        <label for="r-15">15 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="r-20" name="rSide" value="20 min">
                        <label for="r-20">20 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="r-25" name="rSide" value="25 min">
                        <label for="r-25">25 min</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="r-30" name="rSide" value="30 min">
                        <label for="r-30">30 min</label>
                    </div>
                </div>
            </div>

            <!-- Wet Level -->
            <div class="form-group">
                <label class="section-label">Wet Level</label>
                <div class="radio-group">
                    <div class="radio-pill">
                        <input type="radio" id="wet-none" name="wet" value="None" checked>
                        <label for="wet-none">None</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="wet-wet" name="wet" value="Wet">
                        <label for="wet-wet">Wet</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="wet-very" name="wet" value="Very Wet">
                        <label for="wet-very">Very Wet</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="wet-sat" name="wet" value="Saturated">
                        <label for="wet-sat">Saturated</label>
                    </div>
                </div>
            </div>

            <!-- Poo Level (Size) -->
            <div class="form-group">
                <label class="section-label">Poo Level</label>
                <div class="radio-group">
                    <div class="radio-pill">
                        <input type="radio" id="poo-none" name="poo" value="None" checked>
                        <label for="poo-none">None</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="poo-small" name="poo" value="Small">
                        <label for="poo-small">Small</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="poo-med" name="poo" value="Medium">
                        <label for="poo-med">Medium</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="poo-large" name="poo" value="Large">
                        <label for="poo-large">Large</label>
                    </div>
                </div>
            </div>

            <!-- Poo Colour -->
            <div class="form-group">
                <label class="section-label">Poo Colour</label>
                <div class="radio-group">
                    <div class="radio-pill">
                        <input type="radio" id="color-none" name="pooColor" value="N/A" checked>
                        <label for="color-none">N/A</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="color-brown" name="pooColor" value="Brown">
                        <label for="color-brown">Brown</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="color-yellow" name="pooColor" value="Yellow">
                        <label for="color-yellow">Yellow</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="color-green" name="pooColor" value="Green">
                        <label for="color-green">Green</label>
                    </div>
                </div>
            </div>

            <!-- Vomit -->
			<div class="form-group">
                <label class="section-label">Vomit</label>
                <div class="radio-group">
                    <div class="radio-pill">
                        <input type="radio" id="vomit-none" name="vomit" value="None" checked>
                        <label for="vomit-none">None</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="vomit-small" name="vomit" value="Spit Up">
                        <label for="vomit-small">Spit Up</label>
                    </div>
                    <div class="radio-pill">
                        <input type="radio" id="vomit-large" name="vomit" value="Large">
                        <label for="vomit-large">Large</label>
                    </div>
                </div>
            </div>


            <!-- Comments -->
            <div class="form-group">
                <label class="section-label" for="comments">Comments</label>
                <textarea id="comments" name="comments" rows="2" placeholder="Add extra notes..."></textarea>
            </div>
			
            <!-- Submit Button -->
            <button type="submit">Save Entry</button>
			
			<!-- View Sheet Link -->
			<div>
			<br> <br>
            <a href="https://docs.google.com/spreadsheets/d/17JPK58VnpMtRJJqZpGGQ5YjzHmeSmE_Ei_9D0ZQi57c/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn-secondary">
               📊 View Sheet
            </a>
			</div>
			
			
        </form>

        <div id="success-message">Entry logged successfully!</div>
    </div>

    <script>
        // Set current date and time on load
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').value = `${year}-${month}-${day}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').value = `${hours}:${minutes}`;
        });

        const scriptURL = 'https://script.google.com/macros/s/AKfycbzZrdSeT1O0WNZ3tTmHmbS7z3cQnGDnXQbjunu6KIzMtSJXd64UO8OqV8mtF5WXnCKW7Q/exec';
        const form = document.getElementById('trackingForm');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const getRadioVal = (name) => {
                const checked = document.querySelector(`input[name="${name}"]:checked`);
                return checked ? checked.value : '';
            };

            const payload = new URLSearchParams({
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                lSide: getRadioVal('lSide'),
                rSide: getRadioVal('rSide'),
                wet: getRadioVal('wet'),
                pooLevel: getRadioVal('poo'),
                pooColour: getRadioVal('pooColor'),
                comments: document.getElementById('comments').value,
                vomit: getRadioVal('vomit')
            });

            // Send data to Google Sheets
            fetch(scriptURL, { 
                method: 'POST', 
                body: payload,
                mode: 'no-cors' 
            })
            .then(() => {
                successMessage.style.display = 'block';
                
                // Reset fields back to defaults
                document.getElementById('l-none').checked = true;
                document.getElementById('r-none').checked = true;
                document.getElementById('wet-none').checked = true;
                document.getElementById('poo-none').checked = true;
                document.getElementById('color-none').checked = true;
                document.getElementById('vomit-none').checked = true;
                document.getElementById('comments').value = '';

                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('Submission failed. Please try again.');
            });
        });
    </script>
</body>
</html>
